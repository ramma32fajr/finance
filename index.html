<!DOCTYPE html>
<html lang="id">
<head>

    html, body {
      margin: 0;
      padding: 0;

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbz1Naz10-l0W0qcE755pg-pt-IULUFP7NfpV1dIBpPYHNxl1Qb3u2SJ5atBcKebZEQ4LQ/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>
</body>
</html>
